name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image metadata
        id: metadata
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          {
            echo "image=$image"
            echo 'tags<<TAGS'
            echo "$image:sha-$SOURCE_SHA"
            if [ "$EVENT_NAME" = pull_request ]; then
              echo "$image:pr-$PR_NUMBER"
            elif [ "$REF_NAME" = main ]; then
              echo "$image:main"
            fi
            echo TAGS
          } >> "$GITHUB_OUTPUT"
      - name: Build smoke image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: page:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check non-root read-only runtime
        run: |
          test "$(docker image inspect page:smoke --format '{{.Config.User}}')" = '65532:65532'
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=32m \
            --cap-drop ALL --security-opt no-new-privileges page:smoke version
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 and arm64 image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
            org.opencontainers.image.title=page
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Record immutable image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published image: \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
