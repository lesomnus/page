listen: ":8080"
api_listen: "127.0.0.1:50051"
base_domain: example.com
preview_style: flat
preview_alias_mode: qualified # tag-first: readable tag names, then branch fallback
refresh_interval: 5m
# Optional signed GitHub notifications; run/sync only, disabled by default.
# webhook_listen: "127.0.0.1:8081"
# webhook_secret: ${GITHUB_WEBHOOK_SECRET}
storage:
  bucket: page
  prefix: page
  region: us-east-1
  endpoint: http://127.0.0.1:19090
  path_style: true
github:
  - id: company-pages
    owner: your-organization
    owner_type: org
    repository_pattern: '^([a-z0-9][a-z0-9-]*)\.app$'
    manifest_path: page.yaml
    poll_interval: 1m
    recent_commits: 10
    branches: [main, 'feature/*']
    tags: ['v*']
    gc_grace: 24h
    asset_retention: 24h
